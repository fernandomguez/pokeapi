<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Pokémon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="cabecera">
        <div class="cabecera__interior">
            <div class="marca">
                <span class="pokeball" aria-hidden="true"></span>
                <h1>Pokédex</h1>
            </div>
            <p class="cabecera__lema">Busca, filtra y guarda tus Pokémon favoritos</p>
            <div class="search-box">
                <input type="text" id="pokemonInput" placeholder="Buscar por nombre o número: Pikachu, 25..." autocomplete="off">
                <button id="buscarBtn">Buscar</button>
            </div>
        </div>
    </header>

    <div class="container contenido-principal">
        <div class="filtros" role="group" aria-label="Filtros y orden">
            <span class="filtros__titulo">Filtrar por:</span>
            <div class="filtros__botones">
                <button type="button" id="facetaTipo" class="chip chip--facet"
                        aria-expanded="false" aria-controls="panelTipo">Tipo</button>
                <button type="button" id="facetaGen" class="chip chip--facet"
                        aria-expanded="false" aria-controls="panelGen">Generación</button>
                <button type="button" id="facetaOrden" class="chip chip--facet"
                        aria-expanded="false" aria-controls="panelOrden">Ordenar</button>
                <button type="button" id="facetaFav" class="chip chip--facet chip--faceta-favoritos"
                        aria-pressed="false">♥ Favoritos</button>
                <button type="button" id="quitarFiltros" class="chip chip--quitar oculto"
                        title="Quita todos los filtros, el orden y la búsqueda">✕ Quitar filtros</button>
            </div>
            <div id="panelTipo" class="panel oculto">
                <nav class="chips" id="chipsTipos" aria-label="Filtrar por tipo"></nav>
            </div>
            <div id="panelGen" class="panel oculto">
                <nav class="chips" id="chipsGen" aria-label="Filtrar por generación"></nav>
            </div>
            <div id="panelOrden" class="panel oculto">
                <nav class="chips" id="chipsOrden" aria-label="Ordenar la lista"></nav>
            </div>
        </div>
        <div id="resultado"></div>
        <nav id="paginacion" class="pagination" aria-label="Páginas de Pokémon"></nav>
    </div>

    <script src="js/datos.js"></script>
    <script src="js/favoritos.js"></script>
    <script src="js/api.js"></script>
    <script src="js/filtros.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/ficha.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
