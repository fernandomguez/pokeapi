<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Pokémon</title>
    <style>
        :root {
            --primary-color: #ef5350;
            --background-color: #f4f6f9;
            --card-background: #ffffff;
            --text-color: #333333;
            --text-soft: #555555;
            --border-color: #ddd;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 2.5rem 1rem;
        }

        h1 {
            margin: 0 0 1.5rem;
            color: var(--primary-color);
            text-align: center;
            font-size: 1.8rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 0.75rem 1.25rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #d32f2f;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* ---- Chips de filtro (tipos y favoritos) ---- */

        .filtros {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .chip--toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        .chip--toggle .flecha {
            font-size: 0.65rem;
            transition: transform 0.2s;
        }

        #btnFiltros[aria-expanded="true"] .flecha {
            transform: rotate(180deg);
        }

        #btnFiltros[aria-expanded="true"],
        #btnFiltros.chip--on {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .panel {
            text-align: center;
        }

        .oculto {
            display: none;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.4rem;
            margin-bottom: 0.75rem;
        }

        .chip {
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 999px;
            padding: 0.35rem 0.8rem;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-color);
            transition: border-color 0.2s, background-color 0.2s, color 0.2s;
        }

        .chip[aria-pressed="true"] {
            background: var(--tipo, var(--primary-color));
            border-color: transparent;
            color: #fff;
        }

        .chip--favoritos[aria-pressed="true"] {
            background: #e91e63;
        }

        .formas {
            display: flex;
            justify-content: center;
            margin-bottom: 0.25rem;
            font-size: 0.9rem;
            color: var(--text-soft);
        }

        /* ---- Rejilla ---- */

        .p-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1rem;
        }

        .p-card {
            position: relative;
            background: var(--card-background);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 1rem 0.5rem;
            text-align: center;
            color: inherit;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
            animation: fadeIn 0.3s ease-in-out;
        }

        .p-card:hover:not(:disabled) {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .p-card:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .p-card img {
            width: 96px;
            height: 96px;
            object-fit: contain;
            min-height: 96px;
        }

        .p-card .nombre {
            display: block;
            margin-top: 0.5rem;
            text-transform: capitalize;
        }

        .p-card .num {
            display: block;
            font-size: 0.8rem;
            font-weight: normal;
            color: #999;
        }

        .p-card .badges {
            display: flex;
            justify-content: center;
            gap: 0.3rem;
            margin-top: 0.4rem;
            min-height: 1em;
        }

        .badge-tipo {
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            padding: 0.1rem 0.55rem;
            border-radius: 999px;
        }

        /* ---- Corazón de favoritos ---- */

        .corazon {
            position: absolute;
            top: 0.35rem;
            right: 0.35rem;
            background: none;
            border: none;
            padding: 0.15rem 0.3rem;
            font-size: 1.15rem;
            line-height: 1;
            color: #ccc;
        }

        .corazon--activo {
            color: #e91e63;
        }

        .corazon--modal {
            position: static;
        }

        .modal__titulo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .modal__titulo h2 {
            margin: 0;
        }

        /* ---- Paginación ---- */

        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin: 1.5rem 0 0;
        }

        .pagination .info {
            font-size: 0.9rem;
            color: var(--text-soft);
            padding: 0 0.5rem;
        }

        .pagination button {
            padding: 0.6rem 1rem;
        }

        /* ---- Estados ---- */

        .error-message,
        .empty-message {
            text-align: center;
        }

        .error-message {
            color: #d32f2f;
            background: #ffebee;
            padding: 0.75rem;
            border-radius: 6px;
            font-weight: 500;
        }

        .empty-message {
            color: var(--text-soft);
            padding: 2rem 1rem;
        }

        /* ---- Modal de detalle ---- */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            animation: fadeIn 0.2s ease-in-out;
            z-index: 10;
        }

        .modal__card {
            position: relative;
            background: var(--card-background);
            border-radius: 12px;
            padding: 2rem;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }

        .modal__cerrar {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
        }

        .modal__card img {
            width: 150px;
            height: 150px;
            object-fit: contain;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 1rem;
        }

        .tipos {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin: 0.75rem 0 1rem;
        }

        .tipo {
            color: #fff;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
        }

        .pokemon-info {
            display: flex;
            justify-content: space-around;
            font-size: 0.95rem;
            color: var(--text-soft);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Pokédex</h1>
        <div class="search-box">
            <input type="text" id="pokemonInput" placeholder="Buscar por nombre o número: Pikachu, 25..." autocomplete="off">
            <button id="buscarBtn">Buscar</button>
        </div>

        <div class="filtros">
            <button type="button" id="btnFiltros" class="chip chip--toggle"
                    aria-expanded="false" aria-controls="panelFiltros">
                Filtros <span id="filtrosResumen"></span><span class="flecha" aria-hidden="true">▾</span>
            </button>
            <div id="panelFiltros" class="panel oculto">
                <nav id="chipsTipos" class="chips" aria-label="Filtrar por tipo o favoritos"></nav>
                <label class="formas">
                    <input type="checkbox" id="soloOficiales" checked>
                    Solo la Pokédex oficial (1–1025)
                </label>
            </div>
        </div>

        <div id="resultado"></div>
        <nav id="paginacion" class="pagination" aria-label="Páginas de Pokémon"></nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
